services:
  db:
    image: postgres:16-alpine
    container_name: comercios-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-comercios}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-comercios}
      POSTGRES_DB: ${DB_NAME:-comercios}
    # 5433 en el host: el 5432 suele estar ocupado por otro postgres local.
    ports:
      - "5433:5432"
    volumes:
      - comercios_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-comercios} -d ${DB_NAME:-comercios}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: comercios-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8081
      DATABASE_URL: postgresql://${DB_USER:-comercios}:${DB_PASSWORD:-comercios}@db:5432/${DB_NAME:-comercios}?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
    ports:
      - "8081:8081"

volumes:
  comercios_data: